name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          node --input-type=module -e 'import p from "./package.json" with { type: "json" }; if (process.env.RELEASE_TAG !== `v${p.version}`) throw Error("Tag/package version mismatch");'
      - name: Install pnpm for DSH plugin installation
        run: npm install -g pnpm@10.11.0
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run check
      - name: Pack and test all host distributions
        run: |
          node scripts/check-package.mjs .tmp/npm
          node scripts/check-dsh-package.mjs .tmp/dsh-npm
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: |
            .tmp/npm/*.tgz
            .tmp/dsh-npm/*.tgz
          if-no-files-found: error
          include-hidden-files: true
  publish:
    # Enable after the first authenticated publish and trusted-publisher setup.
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/kimi-plugin-cc
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: package
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Bun owns installs/builds. npm is used only for its OIDC publishing support.
      # Locate tarballs explicitly and publish them by anchored ./ paths: current
      # npm parses a bare `package/<file>.tgz` argument as the GitHub shorthand
      # `github:package/<file>` (v2.0.8 publish runs 38647325510 and 38647719689).
      - name: Publish both packed tarballs
        run: |
          set -euo pipefail
          ls -laR package
          mapfile -t TGZ < <(find package -type f -name '*.tgz' | sort)
          test "${#TGZ[@]}" -eq 2 || { echo "expected exactly two .tgz files, found ${#TGZ[@]}" >&2; exit 1; }
          # Bare dir/file arguments are parsed by current npm as GitHub shorthand; anchor them.
          for tarball in "${TGZ[@]}"; do
            npm publish "./${tarball}" --access public --provenance
          done
