name: Real-binary smoke

# The real-binary safety gate: spawns `kimi -p` against the bundled PreToolUse
# hook (with short-lived loopback web activation and deactivation for parallel
# swarms) and verifies end to end that (1) forced writes under read-only modes
# are denied, (2) autonomous goal mode (`write --mode pursue` / `kimi_write`
# `mode: "pursue"`) is hook-gated on every continuation turn, and (3) distinct
# write-swarm children edit only inside the temporary worktree while out-of-root
# writes are denied (requires certified kimi-code >= 2.8.0).
# AgentSwarm call records, aggregate denials, or a coordinator patch alone do not
# prove fan-out; swarm lanes require distinct child journals and assigned work.
#
# Manual dispatch only (no schedule): a goal-mode and write-swarm run consumes a
# few minutes of live model tokens because the model retries against denials and
# write-swarm runs two parallel fan-outs.
#
# Local runs use authorized subscription or API authentication. The harness
# copies selected seed-home files and symlinks OAuth credential stores when
# present: follow docs/ci.md before running it. Run live checks sequentially.
# This optional Actions workflow remains manual and skips model calls unless
# KIMI_MODEL_API_KEY is configured. Each run consumes model quota or API credit.
#
# Auth in CI uses kimi-code's env-model channel (API key) rather than OAuth
# tokens, which expire. Store the key in GitHub Actions encrypted secrets
# (Settings -> Secrets and variables -> Actions), never in the repository.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   Secret  KIMI_MODEL_API_KEY   a pay-per-token API key (Moonshot / OpenAI / Anthropic)
#   Secret  KIMI_MODEL_NAME      the model id to run (for example a kimi model)
#   Variable (optional) KIMI_MODEL_PROVIDER_TYPE   one of: kimi | openai | anthropic  (default: kimi -> api.moonshot.ai)
#   Variable (optional) KIMI_MODEL_BASE_URL        override the provider base URL
# This is a separate billing path from your kimi-code subscription. See docs/ci.md.

on:
  workflow_dispatch:
    inputs:
      kimi_version:
        description: "Exact kimi-code version (default 2.8.0, rolling floor >= 2.8.0): exact 2.8.0 runs all 7 operations including bounded-wave and single-worker swarm; unlisted 2.y.z > 2.8.0 requires the candidate certification seam for full-matrix checks."
        type: string
        default: "2.8.0"
      goal_budget_ms:
        description: "Goal-mode smoke wall-clock budget in ms (bounds token spend)"
        type: string
        default: "90000"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 30 min: non-swarm matrix plus the two write-swarm fan-outs on full-swarm
    # versions (each bounded by its own budget, ~10m + ~6m worst case).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Secrets can't gate a job-level `if:`, so probe in a run step and gate the
      # rest on its output. A missing secret is a graceful skip (warning), not a
      # failure — so unconfigured repos/forks don't get red runs.
      - name: Check auth secret
        id: auth
        env:
          KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KIMI_MODEL_API_KEY not set — skipping the real-binary smoke. Add it in Settings → Secrets and variables → Actions to enable (see docs/ci.md)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Temp-binary technique (docs/upstream-compat-audit.md): install the pinned
      # kimi-code into a throwaway dir and point KIMI_PLUGIN_CC_KIMI_BIN at it —
      # never touches a system install.
      - name: Install pinned kimi-code
        if: steps.auth.outputs.configured == 'true'
        run: |
          D="$RUNNER_TEMP/kimi-bin"
          mkdir -p "$D"
          cd "$D"
          echo '{"name":"kimi-smoke","private":true}' > package.json
          bun add "@moonshot-ai/kimi-code@${{ inputs.kimi_version }}"
          BIN="$D/node_modules/.bin/kimi"
          echo "KIMI_PLUGIN_CC_KIMI_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version

      - name: Run real-binary smokes (read-only + goal mode)
        if: steps.auth.outputs.configured == 'true'
        env:
          KIMI_PLUGIN_CC_SMOKE: "1"
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
          KIMI_MODEL_NAME: ${{ secrets.KIMI_MODEL_NAME }}
          KIMI_MODEL_PROVIDER_TYPE: ${{ vars.KIMI_MODEL_PROVIDER_TYPE || 'kimi' }}
          KIMI_MODEL_BASE_URL: ${{ vars.KIMI_MODEL_BASE_URL }}
          KIMI_PLUGIN_CC_SMOKE_GOAL_BUDGET_MS: ${{ inputs.goal_budget_ms }}
        run: bun test tests/runtime/real-binary-smoke.test.ts --path-ignore-patterns '**/worktrees/**'
