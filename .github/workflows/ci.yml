name: CI

# Base CI: build, generated surfaces, types, tests, and distribution drift. Runs on every
# push to main and every PR. NO secrets, NO kimi binary, NO model tokens — the
# real-binary smokes auto-skip without KIMI_PLUGIN_CC_SMOKE=1. This is the
# per-push safety net the repo previously only had locally via `bun run check`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # The runtime targets Node >= 22.5 (companion + worker spawns); pin the
      # engines floor so CI matches the documented support baseline.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      # Rebuilds and checks root dist/ plus the self-contained Codex package.
      # Generated surface hashes and untracked distribution files are checked too.
      - name: Check (build, surfaces, typecheck, test, drift gate)
        run: bun run check

      - name: Check npm package installation
        run: bun run check:package
