name: CI

# Base CI: build, generated surfaces, types, tests, and distribution drift.
# Runs on every push to main and every pull request without secrets, a kimi
# binary, or model tokens. Real-binary smokes skip unless KIMI_PLUGIN_CC_SMOKE=1.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      # DSH requires Node >= 24.9; the companion still supports >= 22.5.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm for DSH plugin installation
        run: npm install -g pnpm@10.11.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      # Rebuilds root dist/ and checks generated Codex and DSH surfaces (plugins/kimi-codex/,
      # cordis.patch.yml, and dsh/index.json), pinned hashes, and untracked files.
      - name: Check (build, surfaces, typecheck, test, drift gate)
        run: bun run check

      - name: Check root and DSH npm package installation
        run: bun run check:package

      - name: Audit installed npm consumer dependencies
        run: bun run check:consumer-security

  windows-spawn:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bunx tsc -p tsconfig.build.json
      - name: Compiled Windows spawn and large-prompt controls (no model calls)
        run: node --test tests/windows/spawn-preflight.mjs
