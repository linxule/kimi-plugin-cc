name: CI

# Base CI: build, generated surfaces, types, tests, and distribution drift. Runs on every
# push to main and every PR. NO secrets, NO kimi binary, NO model tokens — the
# real-binary smokes auto-skip without KIMI_PLUGIN_CC_SMOKE=1. This is the
# per-push safety net the repo previously only had locally via `bun run check`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # DSH requires Node >= 24.9; the companion still supports >= 22.5.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm for DSH plugin installation
        run: npm install -g pnpm@10.11.0

      - name: Install dependencies
        run: bun install --frozen-lockfile


      # Rebuilds and checks root dist/ plus the self-contained Codex and DSH packages.
      # Generated surface hashes and untracked distribution files are checked too.
      - name: Probe loop (swarm activation, 450 runs)
        run: |
          pass=0; fail=0
          for i in $(seq 1 450); do
            if bun test tests/runtime/swarm-activation.test.ts -t "verifies activation and deactivation through authenticated agent state" > "run-$i.log" 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); echo "=== run $i failed"; grep -n "probe-\|(fail)" "run-$i.log" | cut -c1-1500; fi
          done
          echo "PROBE RESULT pass=$pass fail=$fail"
          echo "retries (any):        $(cat run-*.log | grep -c 'probe-retry')"
          echo "retries rescued:      $(cat run-*.log | grep 'probe-retry' | grep -c '"complete":true')"
          echo "retries not rescued:  $(cat run-*.log | grep 'probe-retry' | grep -c '"complete":false')"
          echo "latch set:            $(cat run-*.log | grep -c 'probe-latch')"
          echo "--- incomplete reasons"
          cat run-*.log | grep 'probe-incomplete' | sort | uniq -c | sort -rn | cut -c1-300 | head -40
          echo "--- latch reasons"
          cat run-*.log | grep 'probe-latch' | sort | uniq -c | cut -c1-300 | head
          echo "--- runs with a rescue"
          grep -l '"complete":true' run-*.log | head -40 | tr '\n' ' '
          nproc; uname -sr



  windows-spawn:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bunx tsc -p tsconfig.build.json
      - name: Compiled Windows spawn and large-prompt controls (no model calls)
        run: node --test tests/windows/spawn-preflight.mjs
